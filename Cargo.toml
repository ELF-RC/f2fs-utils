[package]
name = "f2fs-utils"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "F2FS tool for Android"
license = "GPL-2.0-or-later"
repository = "https://github.com/ELF-RC/f2fs-utils.git"
authors = ["ELF-RC"]
categories = ["filesystem", "command-line-utilities"]
keywords = ["f2fs", "android", "filesystem"]

[lib]
name = "f2fs_utils"
path = "src/lib.rs"

[[bin]]
name = "extract_f2fs"
path = "src/bin/extract_f2fs.rs"

[[bin]]
name = "mkfs_f2fs"
path = "src/bin/mkfs_f2fs.rs"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
byteorder = "1.5"
clap = { version = "4.6", features = ["derive"] }
lz4_flex = "0.14"
regex = "1.11"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
