name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # Cargo 不允许 bin 名含 '.', 源码产物为 extract_f2fs,
      # 重命名为 Android 习惯的 extract.f2fs
      - run: cp target/release/extract_f2fs target/release/extract.f2fs
      - uses: actions/upload-artifact@v4
        with:
          name: f2fs-utils
          path: |
            target/release/extract.f2fs
